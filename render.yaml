services:
  - type: web
    name: tandem-server
    env: node
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tandem-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: tandem-db
    databaseName: tandem
    user: tandem_user
