services:
  - type: web
    name: tandem-server
    env: node
    buildCommand: "npm install && cd client && npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: tandem-db
    databaseName: tandem
    user: tandem_user
